cards:
  - front: craftsman
    meaning: >
      A skilled person who makes things by hand, especially someone who creates high-quality items using traditional methods and expertise.
    examples:
      - The craftsman spent weeks building a beautiful wooden table.
      - My grandfather was a craftsman who made furniture for 40 years.
      - She learned from a master craftsman in Italy.
    translate: Artesão, artífice
    pronounce: crafts-mân
    lang: en
    tags:
      - noun
      - english
      - vocabulary

  - front: resilient
    meaning: >
      Able to recover quickly from difficult conditions; having the ability to bounce back from adversity or adapt to challenging situations.
    examples:
      - The resilient community rebuilt after the natural disaster.
      - Children are often more resilient than adults think.
      - A resilient economy can withstand market fluctuations.
    translate: Resiliente, resistente
    pronounce: ri-ZIL-yənt
    lang: en
    tags:
      - adjective
      - english
      - vocabulary

  - front: serendipity
    meaning: >
      The occurrence and development of events by chance in a happy or beneficial way; a pleasant surprise or fortunate accident.
    examples:
      - Meeting my future business partner at that coffee shop was pure serendipity.
      - The scientist's discovery was a result of serendipity rather than planned research.
      - Sometimes serendipity leads to the best opportunities in life.
    translate: Serendipidade, acaso feliz
    pronounce: ser-ən-DIP-ə-tee
    lang: en
    tags:
      - noun
      - english
      - vocabulary

  - front: caught
    meaning: >
      Past tense of "catch"; captured or trapped; discovered doing something wrong.
    examples:
      - He caught the ball with one hand.
      - She caught a cold last week.
      - They were caught stealing.
    translate: Pegou, capturou, prendeu
    pronounce: cót
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: might
    meaning: >
      Past tense of "may"; used to express possibility or permission in the past; also means power or strength.
    examples:
      - I thought it might rain today.
      - She might come to the party later.
      - The army showed its might in battle.
    translate: Poderia, talvez; força, poder
    pronounce: mait
    lang: en
    tags:
      - verb
      - modal
      - noun
      - vocabulary

  - front: saw
    meaning: >
      A tool with a sharp blade used for cutting wood or metal; also past tense of "see".
    examples:
      - He used a saw to cut the wooden board.
      - I saw her at the store yesterday.
      - The carpenter sharpened his saw.
    translate: Serra; viu (passado de "ver")
    pronounce: só
    lang: en
    tags:
      - noun
      - verb
      - tool
      - vocabulary

  - front: gauge
    meaning: >
      An instrument that measures or displays something; to estimate or judge; the thickness or size of something.
    examples:
      - Check the fuel gauge before driving.
      - It's hard to gauge his reaction.
      - Use a pressure gauge to measure the tire.
    translate: Medidor, calibre; medir, avaliar
    pronounce: gêidj
    lang: en
    tags:
      - noun
      - verb
      - measurement
      - vocabulary

  - front: chisel
    meaning: >
      A metal tool with a sharp edge used for cutting or shaping wood, stone, or metal.
    examples:
      - The sculptor used a chisel to carve the statue.
      - He chiseled the wood carefully.
      - A sharp chisel makes cleaner cuts.
    translate: Formão, cinzel
    pronounce: tchí-zôl
    lang: en
    tags:
      - noun
      - tool
      - vocabulary

  - front: cozy
    meaning: >
      Warm, comfortable, and pleasant; giving a feeling of comfort and relaxation.
    examples:
      - The room felt cozy with the fireplace lit.
      - She wrapped herself in a cozy blanket.
      - They found a cozy café downtown.
    translate: Aconchegante, confortável
    pronounce: côu-zi
    lang: en
    tags:
      - adjective
      - vocabulary

  - front: glue
    meaning: >
      A sticky substance used to join things together; to stick things together using glue.
    examples:
      - Use glue to attach the pieces of paper.
      - The glue needs 24 hours to dry.
      - She glued the broken vase back together.
    translate: Cola; colar
    pronounce: gluu
    lang: en
    tags:
      - noun
      - verb
      - vocabulary

  - front: matter
    meaning: >
      A subject or situation; physical substance; to be important or significant.
    examples:
      - This is a serious matter.
      - What's the matter with you?
      - Your opinion really matters to me.
    translate: Assunto, matéria; importar
    pronounce: má-têr
    lang: en
    tags:
      - noun
      - verb
      - vocabulary

  - front: wild
    meaning: >
      Living in nature, not controlled by humans; uncontrolled, excited, or crazy; not cultivated.
    examples:
      - Wild animals live in the forest.
      - The party got wild after midnight.
      - She has wild, curly hair.
    translate: Selvagem, silvestre; louco, descontrolado
    pronounce: uaild
    lang: en
    tags:
      - adjective
      - vocabulary

  - front: woodwork
    meaning: >
      The wooden parts of a building or room; the craft of making things from wood; carpentry.
    examples:
      - The woodwork in this house is beautiful.
      - He's skilled at woodwork and furniture making.
      - They painted the woodwork white.
    translate: Carpintaria, marcenaria; trabalho em madeira
    pronounce: wúd-wôrk
    lang: en
    tags:
      - noun
      - craft
      - vocabulary

  - front: raised
    meaning: >
      Past tense of "raise"; lifted up; brought up or cared for; increased.
    examples:
      - She raised her hand to ask a question.
      - He was raised by his grandparents.
      - They raised the price last month.
    translate: Levantado, criado, aumentado
    pronounce: rêizd
    lang: en
    tags:
      - verb
      - past tense
      - vocabulary

  - front: forgive
    meaning: >
      To stop feeling angry or resentful toward someone for an offense or mistake; to pardon.
    examples:
      - Please forgive me for being late.
      - It's hard to forgive such betrayal.
      - She forgave him after he apologized.
    translate: Perdoar
    pronounce: fôr-guív
    lang: en
    tags:
      - verb
      - vocabulary

  - front: radon
    meaning: >
      A radioactive gas that occurs naturally and can be harmful to health when it accumulates indoors.
    examples:
      - Test your home for radon levels.
      - Radon is a leading cause of lung cancer.
      - The basement had high radon concentration.
    translate: Radônio (gás radioativo)
    pronounce: rêi-don
    lang: en
    tags:
      - noun
      - science
      - vocabulary

  - front: couple
    meaning: >
      Two people in a romantic relationship; two or a few of something; to join or connect things.
    examples:
      - The couple got married last year.
      - I need a couple of minutes to finish.
      - Wait a couple of days before calling.
    translate: Casal; par, alguns
    pronounce: câ-pôl
    lang: en
    tags:
      - noun
      - vocabulary

  - front: giant
    meaning: >
      An extremely large person or thing; a very large company or organization; huge in size.
    examples:
      - The company is a giant in the tech industry.
      - He's a giant of a man, over 7 feet tall.
      - They built a giant statue in the park.
    translate: Gigante; enorme
    pronounce: djái-ânt
    lang: en
    tags:
      - noun
      - adjective
      - vocabulary

  - front: caught
    meaning: >
      Past tense of "catch"; captured or trapped; discovered doing something wrong.
    examples:
      - He caught the ball with one hand.
      - She caught a cold last week.
      - They were caught stealing.
    translate: Pegou, capturou, prendeu
    pronounce: cót
    lang: en
    tags:
      - verb
      - past tense
      - vocabulary

  - front: albeit
    meaning: >
      Although; even though; used to introduce a contrast or concession.
    examples:
      - The project was successful, albeit expensive.
      - He agreed to help, albeit reluctantly.
      - It's a good solution, albeit not perfect.
    translate: Embora, ainda que
    pronounce: ól-bí-it
    lang: en
    tags:
      - conjunction
      - vocabulary

  - front: craftsman
    meaning: >
      A skilled person who makes things by hand, especially someone who creates high-quality items using traditional methods and expertise.
    examples:
      - The craftsman spent weeks building a beautiful wooden table.
      - My grandfather was a craftsman who made furniture for 40 years.
      - She learned from a master craftsman in Italy.
    translate: Artesão, artífice
    pronounce: crafts-mân
    lang: en
    tags:
      - noun
      - occupation
      - vocabulary

  - front: mallets
    meaning: >
      A type of hammer with a large head, usually made of wood, rubber, or plastic, used for hitting things without damaging them.
    examples:
      - The carpenter used a wooden mallet to join the pieces together.
      - He hit the chisel gently with a rubber mallet.
      - The musician played the xylophone with small mallets.
    translate: Malhos, marretas (de madeira ou borracha)
    pronounce: má-lêts
    lang: en
    tags:
      - noun
      - tool
      - vocabulary

  - front: clamps
    meaning: >
      Tools or devices used to hold things tightly together, usually while gluing, cutting, or working on them.
    examples:
      - Use clamps to hold the wood pieces while the glue dries.
      - The mechanic used metal clamps to secure the hose.
      - She attached clamps to keep the paper in place.
    translate: Grampos, braçadeiras, presilhas
    pronounce: clãmps
    lang: en
    tags:
      - noun
      - tool
      - vocabulary

  - front: sharpened
    meaning: >
      Made sharp or sharper; the past tense of sharpen (to make a blade, point, or edge more sharp).
    examples:
      - He sharpened his knife before cutting the meat.
      - The pencil needs to be sharpened.
      - She sharpened her skills through practice.
    translate: Afiado, aguçado
    pronounce: shár-pênd
    lang: en
    tags:
      - verb
      - past tense
      - vocabulary

  - front: held
    meaning: >
      Past tense of "hold"; to have grasped, carried, or kept something in your hands or arms; to have organized an event.
    examples:
      - She held the baby carefully.
      - The meeting was held yesterday.
      - He held the door open for me.
    translate: Segurou, realizou, manteve
    pronounce: héld
    lang: en
    tags:
      - verb
      - past tense
      - vocabulary

  - front: drawback
    meaning: >
      A disadvantage or problem that makes something less attractive or effective.
    examples:
      - The only drawback of this apartment is the noise.
      - High cost is a major drawback of this solution.
      - The plan has some drawbacks we need to consider.
    translate: Desvantagem, inconveniente
    pronounce: dró-bák
    lang: en
    tags:
      - noun
      - vocabulary

  - front: telemetry
    meaning: >
      The process of automatically measuring and transmitting data from remote sources to receiving equipment for monitoring.
    examples:
      - The spacecraft sends telemetry data back to Earth.
      - We use telemetry to monitor server performance.
      - Medical telemetry tracks patient vital signs remotely.
    translate: Telemetria
    pronounce: tê-lé-mê-tri
    lang: en
    tags:
      - noun
      - technology
      - vocabulary

  - front: pristine
    meaning: >
      In perfect condition; completely clean, fresh, and untouched; like new.
    examples:
      - The car is in pristine condition.
      - They found a pristine beach with no tourists.
      - Keep the documents in pristine shape.
    translate: Pristino, imaculado, perfeito
    pronounce: prís-tiin
    lang: en
    tags:
      - adjective
      - vocabulary

  - front: middle-age
    meaning: >
      The period of life between youth and old age, typically from about 45 to 65 years old.
    examples:
      - He started running marathons in middle-age.
      - Middle-age can be a time of reflection and change.
      - Many people experience a career shift during middle-age.
    translate: Meia-idade
    pronounce: mí-dôl-êidj
    lang: en
    tags:
      - noun
      - vocabulary

  - front: prohibitive
    meaning: >
      So expensive or difficult that it prevents people from doing or buying something; something that forbids or restricts.
    examples:
      - The cost of the course was prohibitive for most students.
      - Prohibitive regulations stopped the project.
      - Housing prices in the city are prohibitive.
    translate: Proibitivo, impeditivo
    pronounce: prôu-í-bi-tiv
    lang: en
    tags:
      - adjective
      - vocabulary

  - front: demoralize
    meaning: >
      To make someone lose confidence, hope, or courage; to cause someone to feel discouraged.
    examples:
      - The constant criticism began to demoralize the team.
      - Don't let one failure demoralize you.
      - The loss demoralized the players.
    translate: Desmoralizar, desanimar
    pronounce: di-mó-râ-laiz
    lang: en
    tags:
      - verb
      - vocabulary

  - front: lovingly
    meaning: >
      In a way that shows love, care, and affection; with tenderness.
    examples:
      - She lovingly prepared his favorite meal.
      - The old house was lovingly restored.
      - He lovingly tucked his daughter into bed.
    translate: Amorosamente, carinhosamente
    pronounce: lâ-ving-li
    lang: en
    tags:
      - adverb
      - vocabulary

  - front: such
    meaning: >
      Of this or that kind; used to emphasize the degree or extent of something; like this or similar to this.
    examples:
      - I've never seen such a beautiful sunset.
      - There's no such thing as a free lunch.
      - Such behavior is unacceptable.
    translate: Tal, tão, semelhante
    pronounce: sâtch
    lang: en
    tags:
      - determiner
      - adjective
      - vocabulary

  - front: ingrain
    meaning: >
      To firmly fix an idea, habit, or attitude in someone's mind so it becomes a permanent part of their character.
    examples:
      - Good habits should be ingrained from childhood.
      - The values were ingrained in the company culture.
      - Years of training ingrained discipline in him.
    translate: Enraizar, incutir profundamente
    pronounce: in-grêin
    lang: en
    tags:
      - verb
      - vocabulary

  - front: deeply
    meaning: >
      To a great depth or degree; profoundly; intensely; far down or far in.
    examples:
      - He was deeply affected by the news.
      - Breathe deeply and relax.
      - She cares deeply about the environment.
    translate: Profundamente, intensamente
    pronounce: díip-li
    lang: en
    tags:
      - adverb
      - vocabulary

  - front: drill
    meaning: >
      A tool or machine used for making holes in hard materials; also means to practice something repeatedly to learn it well, or a training exercise.
    examples:
      - Use an electric drill to make holes in the wall.
      - Students need to drill vocabulary words every day.
      - The firefighters conducted a safety drill.
    translate: Furadeira, broca; treinar repetidamente
    pronounce: drîl
    lang: en
    tags:
      - noun
      - verb
      - tool
      - vocabulary

  - front: scared
    meaning: >
      Feeling frightened or afraid of something that might hurt you or cause danger.
    examples:
      - I was scared when I heard a strange noise at night.
      - Don't be scared, it's just a small spider.
      - She felt scared before her first job interview.
    translate: Assustado, com medo
    pronounce: skérd
    lang: en
    tags:
      - adjective
      - english
      - vocabulary

  - front: fence
    meaning: >
      A structure made of wood, metal, or wire that separates two areas of land or marks a boundary around a property, garden, or field.
    examples:
      - We need to paint the wooden fence in our backyard.
      - The farmer built a fence to keep the sheep inside the field.
      - There's a tall fence around the school playground.
    translate: Cerca, vedação
    pronounce: fens
    lang: en
    tags:
      - noun
      - english
      - vocabulary

  - front: poisonous
    meaning: >
      Something that contains poison and can cause illness, injury, or death if eaten, touched, or absorbed into the body.
    examples:
      - Some mushrooms are poisonous and should never be eaten.
      - That snake is poisonous, so stay away from it.
      - We removed all poisonous plants from the garden.
    translate: Venenoso, tóxico
    pronounce: pói-zô-nâs
    lang: en
    tags:
      - adjective
      - english
      - vocabulary

  - front: glad
    meaning: >
      Feeling happy, pleased, or satisfied about something that happened or a situation.
    examples:
      - I'm glad you could come to my birthday party.
      - She was glad to hear the good news.
      - We're glad that the weather is nice today.
    translate: Feliz, contente, satisfeito
    pronounce: glád
    lang: en
    tags:
      - adjective
      - english
      - vocabulary

  - front: sense
    meaning: >
      The ability to understand, perceive, or be aware of something; also refers to the five physical senses (sight, hearing, smell, taste, touch).
    examples:
      - I have a sense that something good will happen today.
      - Dogs have an excellent sense of smell.
      - It makes sense to save money for the future.
    translate: Sentido, senso, percepção
    pronounce: sens
    lang: en
    tags:
      - noun
      - english
      - vocabulary

  - front: surround
    meaning: >
      To be all around something or someone on every side; to encircle or enclose completely.
    examples:
      - The police surrounded the building.
      - Trees surround our house on all sides.
      - She loves to surround herself with positive people.
    translate: Cercar, rodear, circundar
    pronounce: sâ-ráund
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: instead
    meaning: >
      Used to show that you choose one thing or action rather than another; as an alternative or substitute.
    examples:
      - I don't want coffee, I'll have tea instead.
      - Instead of driving, we decided to walk.
      - He stayed home instead of going to the party.
    translate: Em vez de, ao invés de
    pronounce: in-stéd
    lang: en
    tags:
      - adverb
      - english
      - vocabulary

  - front: cripples
    meaning: >
      Third person singular form of 'cripple' - to cause severe damage or harm that makes someone or something unable to function properly or move normally.
    examples:
      - The disease cripples thousands of people every year.
      - Heavy debt cripples many small businesses.
      - The injury cripples his ability to play sports.
    translate: Paralisa, aleija, incapacita
    pronounce: krí-pâls
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: suck
    meaning: >
      To pull liquid, air, or something into your mouth by making your lips tight and using the muscles of your mouth; informally, to be very bad or unpleasant.
    examples:
      - The baby likes to suck on his bottle.
      - The vacuum cleaner sucks up all the dirt.
      - This movie really sucks (informal - this movie is terrible).
    translate: Sugar, chupar; (informal) ser ruim
    pronounce: sâk
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: won't be able
    meaning: >
      A contraction meaning "will not be able" - used to express that someone or something will lack the capacity, capability, or possibility to do something in the future.
    examples:
      - I won't be able to attend the meeting tomorrow because I'm sick.
      - She won't be able to finish the project on time without help.
      - They won't be able to travel this year due to budget constraints.
    translate: Não será capaz, não poderá, não conseguirá
    pronounce: uôunt bi êi-bâl
    lang: en
    tags:
      - expression
      - modal verb
      - english
      - vocabulary

  - front: be fond of
    meaning: >
      To like someone or something in a gentle or affectionate way.
    examples:
      - She’s very fond of her cat and treats it like family.
      - I’m quite fond of classical music.
      - He’s fond of telling stories about his travels.
    translate: gostar de, ter carinho por
    pronounce: bí fónd óv
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: be into
    meaning: >
      To be very interested or involved in something; to like something a lot.
    examples:
      - I’m really into science fiction movies.
      - She’s into yoga and healthy living.
      - They’re into playing video games on weekends.
    translate: gostar de, estar interessado em
    pronounce: bí ín-tu
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: have a penchant for
    meaning: >
      To have a strong liking or preference for something.
    examples:
      - He has a penchant for expensive cars.
      - She has a penchant for collecting vintage jewelry.
      - I have a penchant for spicy food.
    translate: ter uma predileção por, gostar muito de
    pronounce: rév a pén-tchant fór
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: have a soft spot for
    meaning: >
      To feel affection or sympathy for someone or something, often in a special way.
    examples:
      - She has a soft spot for stray animals.
      - I’ve always had a soft spot for that old café.
      - He has a soft spot for his childhood friends.
    translate: ter um carinho especial por, ter fraqueza por
    pronounce: rév a sóft spót fór
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: adore
    meaning: >
      To love and respect someone or something deeply; to like very much.
    examples:
      - She adores her little sister and always takes care of her.
      - I absolutely adore Italian food.
      - Many fans adore this singer for his kindness.
    translate: adorar, amar muito
    pronounce: á-dór
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: be crazy about
    meaning: >
      To like someone or something a lot; to be very enthusiastic or excited about it.
    examples:
      - He's crazy about football and watches every match.
      - My kids are crazy about chocolate ice cream.
      - She's crazy about her new phone.
    translate: ser louco por, gostar muito de
    pronounce: bí crêi-zi abáut
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: despise
    meaning: >
      To strongly dislike and have no respect for someone or something.
    examples:
      - I despise people who lie all the time.
      - She despises being told what to do.
      - He despised the idea of cheating to win.
    translate: desprezar, odiar
    pronounce: dis-páiz
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: detest
    meaning: >
      To hate someone or something very much.
    examples:
      - I detest waking up early on weekends.
      - She detests the smell of cigarettes.
      - He detests doing paperwork.
    translate: odiar, detestar
    pronounce: di-tést
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: have no taste for
    meaning: >
      To not enjoy or have interest in something.
    examples:
      - I have no taste for horror movies.
      - She has no taste for spicy food.
      - He has no taste for politics.
    translate: não gostar de, não ter interesse por
    pronounce: rév nôu teist fór
    lang: en
    tags:
      - expression
      - english
      - vocabulary

  - front: it is not my cup of tea
    meaning: >
      Used to say that something is not what you like or enjoy.
    examples:
      - Fishing is not my cup of tea.
      - Horror movies aren’t really my cup of tea.
      - Classical music is nice, but it’s not my cup of tea.
    translate: não é a minha praia, não é o que eu gosto
    pronounce: it is nót mái kâp óv tí
    lang: en
    tags:
      - idiom
      - english
      - vocabulary

  - front: loathe
    meaning: >
      To feel intense dislike or disgust for someone or something.
    examples:
      - I loathe getting stuck in traffic.
      - She loathes the cold weather.
      - He loathes dishonesty in any form.
    translate: odiar, abominar
    pronounce: lôudh
    lang: en
    tags:
      - verb
      - english
      - vocabulary

  - front: put somebody off
    meaning: >
      To make someone dislike something or lose interest in it.
    examples:
      - The bad smell put me off my food.
      - His rude behavior really put her off.
      - The teacher’s attitude put many students off the subject.
    translate: desanimar, causar repulsa, fazer alguém perder o interesse
    pronounce: pút sâmbádi óf
    lang: en
    tags:
      - phrasal verb
      - english
      - vocabulary

  - front: I mean
    meaning: >
      An expression used to clarify, correct, or add more explanation to something you just said. Also used when you want to rephrase or emphasize your point.
    examples:
      - The movie was okay, I mean, it wasn't great but not terrible either.
      - I mean, what I'm trying to say is that we need more time.
      - He's not bad at his job, I mean, he tries his best.
    translate: Quer dizer, quero dizer, tipo assim
    pronounce: ai min
    lang: en
    tags:
      - expression
      - filler phrase
      - english
      - vocabulary
  - front: what
    meaning: >
      Used to ask for information about something, to specify or identify things, or to express surprise.
    examples:
      - What is your name?
      - What time is it?
      - What do you want for dinner?
    translate: O que, qual
    pronounce: uát
    lang: en
    tags:
      - question word
      - pronoun
      - english
      - vocabulary

  - front: when
    meaning: >
      Used to ask about time or the occasion of something happening.
    examples:
      - When is your birthday?
      - When did you arrive?
      - When will the meeting start?
    translate: Quando
    pronounce: uén
    lang: en
    tags:
      - question word
      - adverb
      - english
      - vocabulary

  - front: where
    meaning: >
      Used to ask about place or position.
    examples:
